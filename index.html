<script>
const checkoutForm = document.getElementById("checkoutForm");
const submitBtn = document.getElementById("submitOrderBtn");
const message = document.getElementById("orderMessage");

checkoutForm.addEventListener("submit", function(event) {
  event.preventDefault();

  // Ganti `cart` dengan variabel keranjang SNACKVERSE kamu.
  const currentCart = JSON.parse(
    localStorage.getItem("cart") || "[]"
  );

  if (!currentCart.length) {
    message.textContent = "Keranjang kamu masih kosong.";
    return;
  }

  const formData = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    address: document.getElementById("address").value,
    payment: document.getElementById("payment").value,
    website: document.getElementById("website").value,

    // Kirim ID dan qty. Harga akan diperiksa di server.
    items: currentCart.map(item => ({
      id: String(item.id),
      qty: Number(item.qty)
    }))
  };

  submitBtn.disabled = true;
  message.textContent = "Sedang menyimpan pesanan...";

  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || !result.success) {
        message.textContent = "Pesanan belum berhasil disimpan.";
        submitBtn.disabled = false;
        return;
      }

      message.textContent =
        "Pesanan berhasil! Nomor pesanan: " + result.orderId;

      localStorage.removeItem("cart");
      checkoutForm.reset();
      submitBtn.disabled = false;
    })
    .withFailureHandler(function(error) {
      message.textContent =
        error && error.message
          ? error.message
          : "Terjadi kesalahan. Silakan coba kembali.";

      submitBtn.disabled = false;
    })
    .submitOrder(formData);
});
</script>
  
  <script>
const API_URL = "https://script.google.com/macros/s/AKfycbwlpFqoVafYpNEHM-cmXrdIVKmioEz2Zqyn8erxo3lLnHwy06B9lQu9Y9KOUCKa-6s6/exec";

async function loadStock() {
  try {
    const response = await fetch(API_URL + "?action=products");
    const result = await response.json();

    result.products.forEach(product => {
      const stockElement =
        document.getElementById("stock-" + product.id);

      if (stockElement) {
        stockElement.textContent = product.stock;
      }

      const button =
        document.querySelector(
          `[data-id="${product.id}"]`
        );

      if (button) {
        if (product.stock <= 0) {
          button.disabled = true;
          button.textContent = "Stok Habis";
        } else {
          button.disabled = false;
          button.textContent = "Tambah";
        }
      }
    });

  } catch (error) {
    console.error("Gagal mengambil stok:", error);
  }
}

loadStock();
</script>
