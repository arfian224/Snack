
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Checkout | SNACKVERSE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:#0b0b0b;
  font-family:Poppins,Arial,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* === CHECKOUT WRAPPER === */
.checkout{
  width:100%;
  padding:40px;
  display:flex;
  justify-content:center;
}

.checkout-box{
  background:#111;
  max-width:900px;
  width:100%;
  border-radius:24px;
  padding:40px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  box-shadow:0 40px 80px rgba(0,0,0,.7);
  opacity:0;
  transform:translateY(60px);
}

/* === LEFT === */
.checkout-box h2{
  font-size:28px;
  margin-bottom:20px;
}
.checkout-box input,
.checkout-box textarea{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:12px;
  border:none;
  background:#1b1b1b;
  color:#fff;
}

/* === RIGHT SUMMARY === */
.summary{
  background:#0e0e0e;
  padding:25px;
  border-radius:20px;
}
.summary h3{
  margin-bottom:20px;
}
.summary-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:14px;
}
.total{
  margin-top:20px;
  font-size:20px;
  font-weight:bold;
  color:#ffb703;
}

/* === PAYMENT === */
.payment{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-top:15px;
}

/* card */
.payment-card{
  display:flex;
  align-items:center;
  gap:15px;
  padding:16px 18px;
  border-radius:16px;
  background:#151515;
  cursor:pointer;
  transition:.25s ease;
  border:1px solid transparent;
}

/* hide radio */
.payment-card input{
  display:none;
}

/* text */
.payment-info strong{
  font-size:15px;
}
.payment-info span{
  font-size:12px;
  opacity:.7;
}

/* hover */
.payment-card:hover{
  background:#1c1c1c;
  transform:translateY(-2px);
}

/* ACTIVE */
.payment-card:has(input:checked){
  border:1px solid #ffb703;
  box-shadow:0 0 0 2px rgba(255,183,3,.25);
  background:linear-gradient(135deg,#1c1c1c,#141414);
}

/* dot indicator */
.payment-card::after{
  content:"";
  width:10px;
  height:10px;
  border-radius:50%;
  background:#555;
  margin-left:auto;
  transition:.2s;
}
.payment-card:has(input:checked)::after{
  background:#ffb703;
  box-shadow:0 0 10px #ffb703;
}


/* === BUTTON === */
.checkout-btn{
  margin-top:25px;
  width:100%;
  padding:16px;
  border:none;
  border-radius:30px;
  background:#ffb703;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}
.checkout-btn:hover{
  background:#ffd166;
  transform:scale(1.05);
}

/* RESPONSIVE */
@media(max-width:768px){
  .checkout-box{
    grid-template-columns:1fr;
  }
}
</style>

</head>
<body>

<div class="checkout">
 <form class="checkout-box" id="checkoutForm">
  

    <!-- LEFT -->
    <div>
      <h2>Data Pembeli</h2>
      <input
  type="text"
  id="name"
  name="name"
  placeholder="Nama Lengkap"
  required
>

<input
  type="tel"
  id="phone"
  name="phone"
  placeholder="No WhatsApp"
  required
>

<textarea
  id="address"
  name="address"
  placeholder="Alamat Lengkap"
  required>
</textarea>
      
      <h2>Metode Pembayaran</h2>
     <div class="payment">

  <label class="payment-card">
    <input type="radio" name="payment" value="COD" checked>
    <div class="payment-info">
      <strong>COD</strong>
      <span>Bayar saat barang tiba</span>
    </div>
  </label>

  <label class="payment-card">
    <input type="radio" name="payment" value="Transfer">
    <div class="payment-info">
      <strong>Transfer Bank</strong>
    </div>
  </label>

  <label class="payment-card">
    <input type="radio" name="payment" value="E-Wallet">
    <div class="payment-info">
      <strong>E-Wallet</strong>
</div>
  </label>

<label class="payment-card">
    <input type="radio" name="payment" value="QRIS">
    <div class="payment-info">
      <strong>QRIS</strong>
    </div>
  </label>

</div>


  <button type="submit" class="checkout-btn" id="submitOrderBtn">
  Bayar Sekarang
</button>

<p id="orderMessage"></p>
    </div>

    <!-- RIGHT -->
    <div class="summary">
      <h3>Ringkasan Pesanan</h3>
      <div id="summaryItems"></div>
      <div class="total">Total: Rp <span id="total"></span></div>
    </div>

    <input type="hidden" name="cart" id="cartInput">
    <input type="hidden" name="total" id="totalInput">

  </form>
</div>

<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbyhaHrTa7wRjHmRpggMmfH5o8lrvmOd4d9ZCAj-Gnqxg0Ag2-CDosqJVzrbXB2FIZ8z/exec";

/* ============================
   ELEMENT
============================ */

const checkoutForm =
  document.getElementById("checkoutForm");

const submitBtn =
  document.getElementById("submitOrderBtn");

const message =
  document.getElementById("orderMessage");

const summary =
  document.getElementById("summaryItems");


/* ============================
   LOAD CART
============================ */

const cart =
  JSON.parse(
    localStorage.getItem("cart") || "[]"
  );

let total = 0;


/* ============================
   CEK KERANJANG
============================ */

if (cart.length === 0) {

  summary.innerHTML =
    "<p>Keranjang masih kosong.</p>";

  submitBtn.disabled = true;

  submitBtn.textContent =
    "Keranjang Kosong";

}


/* ============================
   TAMPILKAN PESANAN
============================ */

cart.forEach(item => {

  const subtotal =
    Number(item.price) *
    Number(item.qty);

  total += subtotal;


  summary.innerHTML += `
    <div class="summary-item">

      <span>
        ${item.name} x${item.qty}
      </span>

      <span>
        Rp ${subtotal.toLocaleString("id-ID")}
      </span>

    </div>
  `;

});


document.getElementById(
  "total"
).innerText =
  total.toLocaleString("id-ID");


document.getElementById(
  "cartInput"
).value =
  JSON.stringify(cart);


document.getElementById(
  "totalInput"
).value =
  total;


/* ============================
   SUBMIT CHECKOUT
============================ */

checkoutForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    /* ========================
       CEK CART
    ======================== */

    if (cart.length === 0) {

      message.textContent =
        "Keranjang masih kosong.";

      return;

    }


    /* ========================
       AMBIL PAYMENT
    ======================== */

    const selectedPayment =
      document.querySelector(
        'input[name="payment"]:checked'
      );


    if (!selectedPayment) {

      message.textContent =
        "Pilih metode pembayaran.";

      return;

    }


    /* ========================
       DATA PESANAN
    ======================== */

    const orderData = {

      name:
        document
          .getElementById("name")
          .value
          .trim(),

      phone:
        document
          .getElementById("phone")
          .value
          .trim(),

      address:
        document
          .getElementById("address")
          .value
          .trim(),

      payment:
        selectedPayment.value,

      items:
        cart.map(item => ({

          id:
            String(item.id)
              .trim()
              .toLowerCase(),

          qty:
            Number(item.qty)

        }))

    };


    console.log(
      "Mengirim pesanan:",
      orderData
    );


    /* ========================
       LOADING
    ======================== */

    submitBtn.disabled = true;

    submitBtn.textContent =
      "Memproses Pesanan...";

    message.textContent =
      "Sedang menyimpan pesanan...";


    /* ========================
       KIRIM KE APPS SCRIPT
    ======================== */

    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            body:
              JSON.stringify(
                orderData
              )
          }
        );


      const result =
        await response.json();


      console.log(
        "Response server:",
        result
      );


      /* ====================
         SERVER MENOLAK
      ==================== */

      if (!result.success) {

        throw new Error(
          result.message ||
          "Pesanan gagal diproses."
        );

      }


      /* ====================
         BERHASIL
      ==================== */

      message.innerHTML =
        `
        Pesanan berhasil!<br>
        Nomor Pesanan:
        <strong>
          ${result.orderId}
        </strong>
        <br>
        Total:
        <strong>
          Rp ${Number(result.total)
            .toLocaleString("id-ID")}
        </strong>
        `;


      /* ====================
         HAPUS CART
      ==================== */

      localStorage.removeItem(
        "cart"
      );


      submitBtn.textContent =
        "Pesanan Berhasil ✓";


      /* ====================
         REDIRECT
      ==================== */

      setTimeout(() => {

        window.location.href =
          "index.html";

      }, 5000);


    } catch (error) {

      console.error(
        "CHECKOUT ERROR:",
        error
      );


      message.textContent =
        "Gagal: " +
        error.message;


      submitBtn.disabled = false;

      submitBtn.textContent =
        "Bayar Sekarang";

    }

  }
);


/* ============================
   CINEMATIC
============================ */

gsap.to(
  ".checkout-box",
  {

    opacity: 1,

    y: 0,

    duration: 1.2,

    ease: "power4.out"

  }
);
</script>

</body>
</html>
